<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ee" />
    <meta name="description" content="8-sinf (39–51-§) va 10-sinf (2.8–2.15) biologiya darsliklari asosidagi interaktiv o‘quv platformasi." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235b6bb5'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28z' fill='%232f8a86'/%3E%3C/svg%3E" />
    <title>Biologiya — 8 va 10-sinf</title>
    <script>
      // Apply the saved/system theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('bio-app-state') || 'null');
        var t = (s && s.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
